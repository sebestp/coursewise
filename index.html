<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教学资源 · 计算机科学与技术学院</title>
<style>
  :root{
    --blue:#355B9B; --green:#80952E; --ink:#262c38; --muted:#5b6472;
    --line:#d8dfea; --bg:#f5f7fa;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","WenQuanYi Zen Hei","Noto Sans CJK SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--blue); color:#fff; padding:56px 24px 48px; text-align:center;
  }
  header .school{font-size:15px;letter-spacing:4px;color:#c9d6ec;margin-bottom:14px;}
  header h1{font-size:34px;font-weight:700;letter-spacing:1px;}
  header .sub{font-size:15px;color:#b9c8e0;margin-top:12px;}
  main{max-width:880px;margin:0 auto;padding:40px 24px 60px;}
  .card{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:26px 28px;margin-bottom:18px;text-decoration:none;color:inherit;
    transition:box-shadow .18s,border-color .18s,transform .18s;
  }
  .card:hover{
    border-color:var(--blue); box-shadow:0 6px 20px rgba(53,91,155,.12); transform:translateY(-2px);
  }
  .card .idx{
    flex:0 0 auto;width:40px;height:40px;border-radius:8px;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  }
  .card .body{flex:1;min-width:0;}
  .card .t{font-size:20px;font-weight:700;color:var(--blue);margin-bottom:6px;}
  .card .d{font-size:14px;color:var(--muted);line-height:1.5;}
  .card .go{flex:0 0 auto;font-size:14px;color:var(--green);font-weight:600;white-space:nowrap;}
  footer{text-align:center;color:#9aa4b2;font-size:13px;padding:20px 24px 40px;}
</style>
</head>
<body>
  <header>
    <div class="school">浙江工商大学 · 计算机科学与技术学院</div>
    <h1>教学资源</h1>
    <div class="sub">HTML 演示与课件资源</div>
  </header>
  <main>
    <a class="card" href="git.html">
      <div class="idx">1</div>
      <div class="body">
        <div class="t">版本控制 · 基于 Git 的方法</div>
        <div class="d">互动 HTML 课件（v5）</div>
      </div>
      <div class="go">打开 →</div>
    </a>
    <a class="card" href="talent-2027.html">
      <div class="idx">2</div>
      <div class="body">
        <div class="t">2027版本科人才培养方案指导意见解读与专业培养方案设计研讨</div>
        <div class="d">2026-2027-1 学期教学开放周活动 · 系室会议材料</div>
      </div>
      <div class="go">打开 →</div>
    </a>
  </main>
  <footer>浙江工商大学 · 计算机科学与技术学院</footer>
</body>
</html>
